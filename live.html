<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#031238">
<title>CORAL LIVE : MAGICAL UNDERSEA PARTY</title>
<style>
:root{color-scheme:dark;font-family:ui-rounded,"Hiragino Sans",system-ui,sans-serif;background:#031238;color:#fff7d7}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at top,#075d8070,transparent 65%),#031238}
main{width:min(980px,100%);margin:auto;padding:18px max(12px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));text-align:center}
h1{margin:0 0 8px;font-size:clamp(20px,4.5vw,32px);color:#ffe69b;letter-spacing:1px}h1 span{display:block;font-size:.56em;line-height:1.6;letter-spacing:2px}
p{font-size:14px;line-height:1.6;margin:8px 0 14px;color:#bdebf6}
.player{width:100%;aspect-ratio:16/9;min-height:200px;background:#000;border:1px solid #72dced;border-radius:10px;overflow:hidden}
.player iframe{display:block;width:100%;height:100%;border:0}
.actions{margin-top:16px}button{font:inherit;font-size:16px;min-height:44px;border:1px solid #ffefad;border-radius:10px;padding:10px 22px;background:linear-gradient(#fff4ad,#ffd356 48%,#f2a323);color:#59320b;cursor:pointer}
button:focus-visible{outline:3px solid #8ce7ff;outline-offset:4px}
@media(hover:hover) and (pointer:fine){button:hover{filter:brightness(1.08)}}
.note{font-size:16px;line-height:1.8;margin:16px auto 0;max-width:760px;text-align:left}
@media(orientation:landscape) and (max-height:500px){main{padding-top:8px}h1{font-size:20px}h1 span{display:inline;margin-left:8px}.intro{display:none}.player{width:min(100%,calc((100dvh - 94px)*16/9));margin:auto}.actions{margin-top:8px}.note{margin-top:8px}}
</style>
</head>
<body>
<main>
<h1>CORAL LIVE<span>MAGICAL UNDERSEA PARTY</span></h1>
<p class="intro" id="intro">コーラル・バンドのライブを楽しんでね！</p>
<div class="player" id="player"></div>
<div class="actions"><button id="return" type="button">ゲームに戻る</button></div>
<p class="note" id="note">動画の再生ボタンを押してください。プレーヤーの設定アイコンで画質を「1080p」にするとより綺麗な映像でライブを楽しめます。矢印のアイコンで全画面表示もできます。</p>
</main>
<script>
'use strict';
const params=new URLSearchParams(window.location.search);
const en=params.get('lang')==='en';
const embedded=window.parent!==window&&params.get('embedded')==='1';
document.documentElement.lang=en?'en':'ja';
document.querySelector('#intro').textContent=en?'Enjoy the Coral Band’s live show!':'コーラル・バンドのライブを楽しんでね！';
document.querySelector('#return').textContent=en?'Back to the game':'ゲームに戻る';
document.querySelector('#note').textContent=en?'Tap the video’s play button to start. For a clearer picture, use the player’s settings icon to set the quality to “1080p”. You can also use the arrow icon to enter fullscreen.':'動画の再生ボタンを押してください。プレーヤーの設定アイコンで画質を「1080p」にするとより綺麗な映像でライブを楽しめます。矢印のアイコンで全画面表示もできます。';
const player=document.createElement('iframe');
player.title='CORAL LIVE : MAGICAL UNDERSEA PARTY';
player.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
player.setAttribute('allowfullscreen','');
player.referrerPolicy='strict-origin-when-cross-origin';
const videoURL=new URL('https://www.youtube.com/embed/fBhz-3ipqyQ');
videoURL.search=new URLSearchParams({rel:'0',playsinline:'1',fs:'1',controls:'1',autoplay:'0',hl:en?'en':'ja'}).toString();
player.src=videoURL.href;
document.querySelector('#player').append(player);
function returnToGame(){
  player.remove();
  if(embedded){
    // The parent validates both sender window and origin before closing the popup.
    window.parent.postMessage({type:'coral-live-close'},window.location.origin==='null'?'*':window.location.origin);
  }else{
    window.location.href=new URL('index.html',window.location.href).href;
  }
}
document.querySelector('#return').addEventListener('click',returnToGame);
document.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();returnToGame();}});
</script>
</body>
</html>
